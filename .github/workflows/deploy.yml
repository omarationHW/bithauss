name: Deploy

on:
  push:
    branches: [main]

# BH-18: without this block GITHUB_TOKEN inherits the org default, which is
# usually write-all. Deploy needs to read the repo and nothing else.
permissions:
  contents: read

jobs:
  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@bithauss/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Must be NEXT_PUBLIC_* so Next.js inlines it into the client bundle.
          # Without the prefix, client-side fetch(`${process.env.NEXT_PUBLIC_API_URL}/...`)
          # collapses to a relative path and hits the web host (500 on /api/v1/*).
          NEXT_PUBLIC_API_URL: https://bithauss-api.azurewebsites.net

      - name: Prepare standalone package
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          mkdir -p apps/web/.next/standalone/apps/web/public
          cp -r apps/web/public/* apps/web/.next/standalone/apps/web/public/ 2>/dev/null || true

      # BH-02: these two were missing in production. Their absence did not
      # crash anything — it made every BRC certificate answer NO_ENCONTRADO.
      # Fail the deploy here instead of shipping a silently broken release.
      - name: Verify required web secrets are present
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BRC_VERIFY_SECRET: ${{ secrets.BRC_VERIFY_SECRET }}
        run: |
          missing=""
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -n "$BRC_VERIFY_SECRET" ] || missing="$missing BRC_VERIFY_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos de GitHub para bithauss-web:$missing"
            echo "Genera BRC_VERIFY_SECRET con: openssl rand -hex 32"
            echo "Ver docs/SECURITY.md, seccion 4.1."
            exit 1
          fi

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set app settings
        run: |
          az webapp config appsettings set \
            --name bithauss-web \
            --resource-group bithauss-rg \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITES_PORT=3000 \
              NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
              NEXT_PUBLIC_API_URL="https://bithauss-api.azurewebsites.net" \
              API_URL="https://bithauss-api.azurewebsites.net" \
              SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              BRC_VERIFY_SECRET="${{ secrets.BRC_VERIFY_SECRET }}" \
              SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
              NEXT_PUBLIC_SENTRY_DSN="${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}" \
              RATE_LIMIT_PROXY_DEPTH="${{ vars.RATE_LIMIT_PROXY_DEPTH || '1' }}" \
            --output none

      - name: Configure startup
        run: |
          az webapp config set \
            --name bithauss-web \
            --resource-group bithauss-rg \
            --startup-file "node apps/web/server.js" \
            --output none

      - name: Wait for SCM container to stabilize
        run: sleep 30

      - uses: azure/webapps-deploy@v3
        with:
          app-name: bithauss-web
          package: apps/web/.next/standalone

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@bithauss/api

      - name: Create deploy bundle
        # node-linker=hoisted produces a flat node_modules without pnpm symlinks,
        # which Azure App Service's zip deploy can preserve reliably.
        run: pnpm --filter=@bithauss/api --legacy --config.node-linker=hoisted deploy --prod deploy-api

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set app settings
        run: |
          az webapp config appsettings set \
            --name bithauss-api \
            --resource-group bithauss-rg \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              FRONTEND_URL="https://bithauss-web.azurewebsites.net" \
              SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
              SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              AZURE_DOC_INTELLIGENCE_ENDPOINT="${{ secrets.AZURE_DOC_INTELLIGENCE_ENDPOINT }}" \
              AZURE_DOC_INTELLIGENCE_KEY="${{ secrets.AZURE_DOC_INTELLIGENCE_KEY }}" \
              AZURE_OPENAI_ENDPOINT="${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
              AZURE_OPENAI_KEY="${{ secrets.AZURE_OPENAI_KEY }}" \
              AZURE_OPENAI_DEPLOYMENT="${{ secrets.AZURE_OPENAI_DEPLOYMENT }}" \
              STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
              STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
              SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --output none

      - name: Configure startup
        run: |
          az webapp config set \
            --name bithauss-api \
            --resource-group bithauss-rg \
            --startup-file "node dist/main" \
            --output none

      - name: Wait for SCM container to stabilize
        run: sleep 30

      - uses: azure/webapps-deploy@v3
        with:
          app-name: bithauss-api
          package: deploy-api
